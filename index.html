<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="author" content="CSIP Servicios Financieros" />

    <!-- Aquí sólo van las etiquetas comunes a todas las páginas. El título, la
         descripción, la canónica, las Open Graph con URL y el JSON-LD son
         propios de cada ruta y los inyecta scripts/prerender.mjs a partir de
         src/seo.js. Las precargas con hash las añade el plugin de
         vite.config.js, que es quien conoce los nombres del bundle. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CSIP Servicios Financieros" />
    <meta property="og:locale" content="es_MX" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#1F3391" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Las tipografías se autohospedan (ver @font-face en src/index.css) y el
         plugin de vite.config.js inyecta aquí su precarga con el nombre real
         del archivo generado. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
